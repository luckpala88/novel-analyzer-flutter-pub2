name: novel_analyzer
description: "网文拆解器 - Flutter版"
publish_to: 'none'
version: 1.0.1638+1638

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0 # v1593：内置浏览器——七猫/番茄榜单页（WAF只放行真浏览器）
  fast_gbk: ^1.0.0 # v1593：飞卢gb2312页面解码
  cached_network_image: ^3.3.1
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.0.2
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  file_picker: ^13.1.0
  scroll_to_index: ^3.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/docs/help_manual.md
  fonts:
    - family: WenKai
      fonts:
        - asset: assets/fonts/wenkai.ttf
    - family: KaiShu
      fonts:
        - asset: assets/fonts/kai.ttf
    - family: XingShu
      fonts:
        - asset: assets/fonts/xing.ttf
    - family: CaoShu
      fonts:
        - asset: assets/fonts/cao.ttf
    - family: QiuHong
      fonts:
        - asset: assets/fonts/qiuhong.ttf
    - family: YouRan
      fonts:
        - asset: assets/fonts/youran.ttf
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/mashanzheng.ttf
